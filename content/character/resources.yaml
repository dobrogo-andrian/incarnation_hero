# Character resources (§2.2). Maximum = base + coefficient × source (D27).
# Injuries, purity and the like change maximums through modifiers.

- id: resource.health
  name: { uk: "Здоров'я" }
  source: aspect.might.vitality
  coefficient: 10
  regen_per_week: 10            # rest returns health, but only up to the ceiling injuries leave (§8)

- id: resource.body_energy
  name: { uk: "Енергія тіла" }
  source: aspect.endurance.reserve   # the reserve sizes the fight's energy pool, the output refills it each turn (D55)
  coefficient: 1.5
  regen_per_week: 10            # full again within about a week of rest

- id: resource.qi_pool
  name: { uk: "Пул ці" }
  base: 100
  source: stat.purity           # purity widens the pool (§4.2)
  coefficient: 2
  regen_per_week: 2             # returns on its own (§13.4); recovery meditation adds more

- id: resource.combat_qi
  name: { uk: "Бойова ці" }
  source: aspect.meridians.capacity
  coefficient: 5
  regen_per_week: 25            # the qi shield gathers again between fights; in a fight it refills from the pool (D42)

- id: resource.toxins
  name: { uk: "Токсини" }
  start_empty: true             # pills fill it; the maximum is the tolerance (§4.4)
  base: 20
  source: stat.purity           # purity raises the tolerance (§4.2)
  coefficient: 1
