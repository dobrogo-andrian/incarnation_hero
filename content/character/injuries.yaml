# General injury scales (§8, tech 4.6, D37). Draft numbers until Sim.Cli reports.
# Every point applies `effects` as Mul modifiers (-0.005 is −0.5% per point); injuries reach
# breakthroughs through the purity they wear away (stat.purity erosion, D49). Scales heal heal_per_week
# whatever the player does, rest_heal_per_week more while resting; pills and healing meditation help too.

- id: injury.body
  name: { uk: "Тілесні травми" }
  max: 100
  heal_per_week: 0.5
  rest_heal_per_week: 2.5
  effects:
    resource.health: -0.005          # the health ceiling: rest heals only up to it (§8)
    resource.body_energy: -0.004

- id: injury.internal
  name: { uk: "Внутрішні травми" }
  max: 100
  heal_per_week: 0.2
  rest_heal_per_week: 0.8
  effects:
    aspect.meridians.flow: -0.004    # hurt meridians pass less qi per turn (§7.1)
