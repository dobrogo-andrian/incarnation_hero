# Rumor templates (§10, D41). Arriving in the zone opens the node that is really there:
# `truth` when the claim holds, otherwise one of `falsehoods`; `taken` when rivals came first.

- id: rumor.bamboo_grove.spirit_herb
  name: { uk: "Духовна трава" }
  text: { uk: "Кажуть, у Бамбуковому гаю дозріла духовна трава: хто встигне першим, той збере жменю, з якої виходить добра пігулка. Щоправда, біля неї бачили вовчі сліди." }
  zone: zone.bamboo_grove
  window_weeks: { min: 12, max: 20 }
  appeal: 1
  weight: 10
  cooldown_weeks: 104
  truth: herb
  falsehoods: { weeds: 2, wolves: 1 }
  nodes:
    herb:
      text: { uk: "Серед бамбука м'яко світиться кущик трави з росою, що не висихає навіть опівдні. Чутка не збрехала." }
      options:
        - text: { uk: "Зібрати й одразу ковтнути росу" }
          effects: [ { pill_energy: 40 } ]
        - text: { uk: "Зібрати обережно, щоб продати аптекарям" }
          effects: [ { stones: 20 } ]
    weeds:
      text: { uk: "Трава справді є, але звичайна: трохи ці в ній ледь жевріє. Хтось дуже прикрасив розповідь." }
      options:
        - text: { uk: "Взяти, що є" }
          effects: [ { pill_energy: 8 } ]
    wolves:
      text: { uk: "Трави немає, зате є вовче лігво. Сірі тіні вже оточують вас." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.beast.grey_wolves, win: wolves_won, loss: wolves_lost } } ]
    wolves_won:
      text: { uk: "Зграя розбігається. У лігві знаходите кістки невдахи, що прийшов сюди до вас, і його гаманець." }
      options:
        - text: { uk: "Забрати гаманець" }
          effects: [ { stones: 10 }, { combat_insight: 15 } ]
    wolves_lost:
      text: { uk: "Ви ледве відбиваєтеся й шкутильгаєте геть із гаю." }
    taken:
      text: { uk: "На місці лише витоптана земля і зрізані стебла. Хтось устиг раніше." }

- id: rumor.misty_hills.fallen_cultivator
  name: { uk: "Останки культиватора" }
  text: { uk: "Шепочуть, що в Туманних пагорбах загинув мандрівний культиватор, і його торба досі лежить серед скель. Кажуть, у ній був фоліант про вогонь." }
  zone: zone.misty_hills
  window_weeks: { min: 16, max: 30 }
  appeal: 2
  weight: 8
  cooldown_weeks: 156
  truth: satchel
  falsehoods: { stones_only: 2, ambush: 1 }
  nodes:
    satchel:
      text: { uk: "Під навислою скелею — висохле тіло в подертому халаті. У торбі камені й обгорілий з країв фоліант." }
      options:
        - text: { uk: "Поховати його й забрати торбу" }
          effects: [ { item: { id: item.folio.fire, amount: 1 } }, { stones: 15 } ]
    stones_only:
      text: { uk: "Тіло знаходиться, але фоліанта при ньому немає. Лише кілька каменів у гаманці." }
      options:
        - text: { uk: "Забрати камені" }
          effects: [ { stones: 12 } ]
    ambush:
      text: { uk: "Ніякого тіла немає. Зате з-за скель виходять розбійники: чутку, схоже, пустили вони самі." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.bandits.road, win: ambush_won, loss: ambush_lost } } ]
        - text: { uk: "Відкупитися 15 каменями" }
          conditions: [ { stones: { min: 15 } } ]
          effects: [ { stones: -15 } ]
    ambush_won:
      text: { uk: "Розбійники розбігаються, кинувши здобич попередніх легковірних." }
      options:
        - text: { uk: "Забрати здобич" }
          effects: [ { stones: 20 }, { combat_insight: 20 } ]
    ambush_lost:
      text: { uk: "Вас обчищають і лишають серед туману." }
      options:
        - text: { uk: "Підвестися" }
          effects: [ { stones: -10 } ]
    taken:
      text: { uk: "Під скелею свіжий горбик землі й ні сліду торби. Хтось поховав мерця і забрав його речі." }

- id: rumor.old_battlefield.war_relic
  name: { uk: "Реліквія старого поля бою" }
  text: { uk: "Учні сект переказують: ночами над старим полем бою спалахують вогники, і там, де вони сходяться, закопано спис полководця, що пам'ятає його техніку. Але й мертві там неспокійні." }
  zone: zone.old_battlefield
  window_weeks: { min: 20, max: 40 }
  appeal: 3
  weight: 5
  cooldown_weeks: 208
  truth: spear
  falsehoods: { rust: 2, ghosts: 2 }
  nodes:
    spear:
      text: { uk: "Опівночі вогники кружляють над пагорбом. Під дерном — спис, і щойно ви торкаєтеся держака, у пам'яті спалахують рухи давнього майстра." }
      options:
        - text: { uk: "Повторювати рухи до світанку" }
          effects: [ { time: 1 }, { knowledge: { id: tech.spear.piercing_dragon, amount: 40 } }, { combat_insight: 30 } ]
    rust:
      text: { uk: "Ви знаходите спис, але це просто іржаве залізо. Хіба що постояти на місці давньої битви корисно." }
      options:
        - text: { uk: "Помедитувати серед кісток" }
          effects: [ { combat_insight: 10 } ]
    ghosts:
      text: { uk: "Вогники сходяться — і стають постатями в обладунках. Мертві не віддають свого." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.undead.battlefield_ghosts, win: ghosts_won, loss: ghosts_lost } } ]
    ghosts_won:
      text: { uk: "Примари розсипаються попелом. Холод бою ще довго дзвенить у меридіанах." }
      options:
        - text: { uk: "Перевести подих" }
          effects: [ { combat_insight: 35 } ]
    ghosts_lost:
      text: { uk: "Крижаний дотик примар проникає до самих меридіан. Ви тікаєте до світанку." }
    taken:
      text: { uk: "Пагорб розкопано, а вогники більше не з'являються. Хтось уже забрав те, що тут було." }

- id: rumor.bamboo_grove.sword_shrine
  name: { uk: "Святилище меча" }
  text: { uk: "Кажуть, у глибині Бамбукового гаю знайшли поросле мохом святилище мечника. На камені вирізано рухи його техніки, і хто їх прочитає, той збагне плинний удар." }
  zone: zone.bamboo_grove
  window_weeks: { min: 16, max: 30 }
  appeal: 2
  weight: 6
  cooldown_weeks: 156
  truth: carvings
  falsehoods: { altar: 2, hideout: 1 }
  nodes:
    carvings:
      text: { uk: "Серед бамбука стоїть камінь у людський зріст. Рядки рухів вирізано так глибоко, що їх видно навіть під мохом." }
      options:
        - text: { uk: "Вивчати різьбу (2 тижні)" }
          effects: [ { time: 2 }, { knowledge: { id: tech.sword.flowing_cut, amount: 40 } } ]
        - text: { uk: "Лише запам'ятати перші рядки" }
          effects: [ { knowledge: { id: tech.sword.flowing_cut, amount: 12 } } ]
    altar:
      text: { uk: "Святилище є, але різьбу давно стерли дощі. Лишився тільки спокій старого місця." }
      options:
        - text: { uk: "Посидіти в тиші" }
          effects: [ { stat: { id: stat.purity, amount: 1 } } ]
    hideout:
      text: { uk: "Замість святилища — табір розбійників, які пустили чутку, щоб заманювати шукачів." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.bandits.road, win: hideout_won, loss: hideout_lost } } ]
        - text: { uk: "Тихо відступити" }
          outcomes:
            - weight: 5
              weight_per_stat: { aspect.speed.agility: 0.3 }
              success: true
              next: slipped
            - weight: 4
              effects: [ { start_combat: { group: grp.bandits.road, win: hideout_won, loss: hideout_lost } } ]
    hideout_won:
      text: { uk: "Розбійники розбігаються, лишивши в таборі награбоване." }
      options:
        - text: { uk: "Забрати награбоване" }
          effects: [ { stones: 18 }, { combat_insight: 20 } ]
    hideout_lost:
      text: { uk: "Вас обчищають і проганяють з гаю." }
      options:
        - text: { uk: "Піти геть" }
          effects: [ { stones: -10 } ]
    slipped:
      text: { uk: "Ви задкуєте в зарості, і ніхто вас не помічає." }
    taken:
      text: { uk: "Біля каменя свіжі сліди, а різьбу хтось збив молотом, щоб ніхто інший її не прочитав." }

- id: rumor.river_valley.spirit_carp
  name: { uk: "Духовний короп" }
  text: { uk: "Рибалки клянуться, що в Річковій долині випливає духовний короп із золотою лускою. Його м'ясо — як добра пігулка, а луска чогось варта в аптекарів. Тільки у вирі під валуном, кажуть, живе щось більше." }
  zone: zone.river_valley
  window_weeks: { min: 8, max: 16 }
  appeal: 2
  weight: 8
  cooldown_weeks: 104
  truth: carp
  falsehoods: { plain_fish: 2, serpent: 1 }
  nodes:
    carp:
      text: { uk: "На світанку вода біля валуна спалахує золотом. Короп важкий, і від нього тягне чистою ці." }
      options:
        - text: { uk: "Приготувати й з'їсти" }
          effects: [ { pill_energy: 50 } ]
        - text: { uk: "Продати луску й м'ясо аптекарям" }
          effects: [ { stones: 25 } ]
    plain_fish:
      text: { uk: "Короп справжній, тільки звичайний: луска руда, а ці в ньому не більше, ніж у карасі." }
      options:
        - text: { uk: "Хоч повечеряти" }
          effects: [ { resource: { id: resource.health, amount: 10 } } ]
    serpent:
      text: { uk: "Вода закипає, і з виру здіймається лускатий змій завтовшки з колоду. Короп, якщо й був, давно в його череві." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.beast.river_serpent, win: serpent_won, loss: serpent_lost } } ]
        - text: { uk: "Відскочити від води" }
          effects: [ { injury: { id: injury.body, amount: 5 } } ]
    serpent_won:
      text: { uk: "Змій зникає у вирі, лишивши на камінні кілька лусок завбільшки з долоню." }
      options:
        - text: { uk: "Зібрати луску" }
          effects: [ { stones: 20 }, { combat_insight: 30 } ]
    serpent_lost:
      text: { uk: "Хвіст змія збиває вас у воду. Ви вибираєтеся на берег уже далеко за течією." }
    taken:
      text: { uk: "На березі тліє вогнище, а поруч — риб'ячі кістки із золотим полиском. Хтось устиг раніше." }

- id: rumor.misty_hills.alchemist_garden
  name: { uk: "Сад алхіміка" }
  text: { uk: "Кажуть, у Туманних пагорбах здичавів сад покійного алхіміка: там досі ростуть трави, з яких виходять пігулки, що заспокоюють меридіани. Треба лише знати, які з них не отруйні." }
  zone: zone.misty_hills
  window_weeks: { min: 20, max: 40 }
  appeal: 1
  weight: 8
  cooldown_weeks: 104
  conditions:
    - reputation: { id: sect.hundred_herbs, min: 1 }
  truth: garden
  falsehoods: { mushrooms: 2 }
  nodes:
    garden:
      text: { uk: "За поваленою огорожею — грядки, які ніхто не полов роками. Та потрібні трави ще можна впізнати." }
      options:
        - text: { uk: "Зібрати й віддати аптекарям на пігулки" }
          effects: [ { item: { id: item.pill.meridian_soothing, amount: 2 } }, { reputation: { id: sect.hundred_herbs, amount: 5 } } ]
    mushrooms:
      text: { uk: "Від саду лишилися тільки гриби з різким запахом. Схоже, хтось сплутав сад алхіміка з його смітником." }
      options:
        - text: { uk: "Спробувати один" }
          outcomes:
            - weight: 2
              weight_per_stat: { stat.perception: 0.3 }
              success: true
              effects: [ { pill_energy: 15 } ]
              next: lucky
            - weight: 3
              effects: [ { resource: { id: resource.toxins, amount: 10 } } ]
              next: poisoned
        - text: { uk: "Піти" }
    lucky:
      text: { uk: "Гриб гіркий, але ці в ньому справжня." }
    poisoned:
      text: { uk: "У роті пече, а в меридіанах осідає каламуть." }
    taken:
      text: { uk: "Грядки перекопано, лишилися тільки бур'яни. Аптекарі, видно, дізналися першими." }

- id: rumor.spirit_peak.vein_surge
  name: { uk: "Сплеск духовної жили" }
  text: { uk: "Старі культиватори кажуть, що жила під Піком ось-ось сплесне: кілька тижнів ці там битиме ключем, і хто медитуватиме поруч, той очистить тіло за раз. Але сплеск буває і бурею." }
  zone: zone.spirit_peak
  window_weeks: { min: 6, max: 12 }
  appeal: 2
  weight: 5
  cooldown_weeks: 156
  truth: surge
  falsehoods: { trickle: 2, storm: 1 }
  nodes:
    surge:
      text: { uk: "Камінь під ногами гуде, і ці піднімається з тріщин, густа, як туман. Такої нагоди може більше не бути." }
      options:
        - text: { uk: "Медитувати в самому сплеску (2 тижні)" }
          effects: [ { time: 2 }, { stat: { id: stat.purity, amount: 4 } }, { resource: { id: resource.toxins, amount: -10 } } ]
    trickle:
      text: { uk: "Жила й справді ворушиться, та сплеск слабкий: ледь відчутний подих із тріщин." }
      options:
        - text: { uk: "Взяти, що дає" }
          effects: [ { stat: { id: stat.purity, amount: 1 } } ]
    storm:
      text: { uk: "Ці виривається з тріщин шаленим вихором і б'є в меридіани, як блискавка." }
      options:
        - text: { uk: "Втримати її в собі" }
          outcomes:
            - weight: 3
              weight_per_stat: { stat.meridians: 0.2 }
              success: true
              effects: [ { stat: { id: stat.purity, amount: 3 } } ]
              next: held
            - weight: 4
              effects: [ { injury: { id: injury.internal, amount: 15 } } ]
              next: burned
        - text: { uk: "Сховатися за скелю" }
    held:
      text: { uk: "Вихор проходить крізь вас і вщухає. Тіло легке, наче вимите." }
    burned:
      text: { uk: "Меридіани не витримують. Ви отямлюєтеся на камінні з присмаком крові в роті." }
    taken:
      text: { uk: "Біля тріщин сидять троє культиваторів з чужої секти. Сплеск минув, і все дісталося їм." }

- id: rumor.ancient_tomb.master_cache
  name: { uk: "Схованка Забутого Майстра" }
  text: { uk: "У чайній шепочуться: в Гробниці Забутого Майстра є друга зала, де лежить фоліант його списової техніки. Ті, хто туди ходив, розповідають про вартового, що не спить." }
  zone: zone.ancient_tomb
  window_weeks: { min: 20, max: 40 }
  appeal: 3
  weight: 4
  cooldown_weeks: 208
  truth: cache
  falsehoods: { empty_hall: 2, guardian: 2 }
  nodes:
    cache:
      text: { uk: "За фальшивою стіною — тісна зала. На кам'яній полиці, загорнутий у шовк, лежить фоліант." }
      options:
        - text: { uk: "Забрати фоліант" }
          effects: [ { item: { id: item.folio.piercing_dragon, amount: 1 } } ]
    empty_hall:
      text: { uk: "Друга зала існує, але порожня: лише пил і кілька забутих каменів у кутку." }
      options:
        - text: { uk: "Забрати камені" }
          effects: [ { stones: 15 } ]
    guardian:
      text: { uk: "У темряві скрегоче камінь: вартовий гробниці повертає до вас порожні очниці." }
      options:
        - text: { uk: "Битися" }
          effects: [ { start_combat: { group: grp.undead.tomb_guardian, win: guardian_won, loss: guardian_lost } } ]
        - text: { uk: "Тікати до виходу" }
          effects: [ { injury: { id: injury.internal, amount: 8 } } ]
    guardian_won:
      text: { uk: "Вартовий розсипається, і за ним відкривається ніша з підношеннями." }
      options:
        - text: { uk: "Забрати підношення" }
          effects: [ { stones: 40 }, { combat_insight: 50 } ]
    guardian_lost:
      text: { uk: "Удар вартового відкидає вас до стіни. Ви виповзаєте з гробниці, ледве тримаючись на ногах." }
    taken:
      text: { uk: "Фальшиву стіну вже розбито, полиця порожня. На пилу — свіжі сліди чобіт." }
