# Events while resting outside the settlement (§10, D38).

- id: evt.rest.night_thief
  contexts: [rest]
  weight: 8
  cooldown_weeks: 52
  conditions:
    - stones: { min: 5 }
  nodes:
    start:
      text: { uk: "Уночі вас будить ледь чутний шурхіт: хтось нишпорить у вашій торбі." }
      options:
        - text: { uk: "Схопити злодія" }
          outcomes:
            - weight: 4
              weight_per_stat: { aspect.speed.reaction: 0.3 }
              success: true
              effects: [ { stones: 5 } ]
              next: caught
            - weight: 4
              effects: [ { stones: -8 } ]
              next: escaped
        - text: { uk: "Вдати, що спите" }
          effects: [ { stones: -5 } ]
          next: pretended
    caught:
      text: { uk: "Ви перехоплюєте худу руку. Малий злодюжка, плачучи, віддає все, що встиг поцупити в інших." }
    escaped:
      text: { uk: "Тінь вислизає з-під пальців і зникає разом із частиною ваших каменів." }
    pretended:
      text: { uk: "Злодій бере небагато й тихо йде. Принаймні ніхто не постраждав." }

- id: evt.rest.relic_hunters
  contexts: [rest]
  weight: 8
  cooldown_weeks: 52
  conditions:
    - zone: [zone.old_battlefield]
  nodes:
    start:
      text: { uk: "Опівночі над полем бою блукають ліхтарі: двоє культиваторів розкопують старі могили. Вони помічають ваше багаття й рушають до вас." }
      options:
        - text: { uk: "Стати проти шукачів" }
          effects: [ { start_combat: { group: grp.human.relic_hunters, win: won, loss: lost } } ]
        - text: { uk: "Затамувати подих і стежити за ними з темряви" }
          conditions: [ { stat: { id: stat.perception, min: 3 } } ]
          effects: [ { combat_insight: 10 } ]
          next: watched
        - text: { uk: "Тікати до світанку" }
          effects: [ { injury: { id: injury.body, amount: 3 } } ]
          next: fled
    won:
      text: { uk: "Шукачі тікають, покинувши здобич. У траві поблискують уламки старої зброї." }
      options:
        - text: { uk: "Зібрати уламки" }
    lost:
      text: { uk: "Удари, насичені ці, пробирають до самих меридіан. Ви отямлюєтеся вранці, знесилені й обібрані." }
    watched:
      text: { uk: "Вони проходять повз. До світанку ви подумки повторюєте, як вони тримають зброю." }
    fled:
      text: { uk: "Ви біжите навмання темним полем і не раз падаєте серед ям і кісток." }

- id: evt.rest.campfire_stranger
  contexts: [rest]
  weight: 6
  cooldown_weeks: 78
  nodes:
    start:
      text: { uk: "До вашого вогнища підсідає старий мандрівник і просить погрітися. Кажуть, такі бачили багато доріг." }
      options:
        - text: { uk: "Поділитися їжею й розпитати" }
          effects: [ { add_rumor: { id: rumor.spirit_peak.vein_surge, source: source.tea_house_gossip } } ]
          next: story
        - text: { uk: "Вартувати всю ніч, не довіряючи" }
          effects: [ { resource: { id: resource.body_energy, amount: -20 } } ]
          next: watched
    story:
      text: { uk: "Старий довго дивиться у вогонь, а потім розповідає, що жила під Піком скоро сплесне. Уранці його вже немає." }
    watched:
      text: { uk: "Старий мирно спить до світанку й іде, подякувавши. Ви ж ледве тримаєтеся на ногах." }
