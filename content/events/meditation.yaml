# Events while meditating (§10, D38). Only dangerous ones (D74): peaceful events no longer interrupt
# meditation; rumors, ambushes (D73) and these still do.

- id: evt.meditation.relic_hunters
  contexts: [meditation]
  weight: 8
  cooldown_weeks: 52
  conditions:
    - zone: [zone.old_battlefield]
  nodes:
    start:
      text: { uk: "Опівночі над полем бою блукають ліхтарі: двоє культиваторів розкопують старі могили. Вони помічають ваше багаття й рушають до вас." }
      options:
        - text: { uk: "Стати проти шукачів" }
          effects: [ { start_combat: { group: grp.human.relic_hunters, win: won, loss: lost } } ]
        - text: { uk: "Затамувати подих і стежити за ними з темряви" }
          conditions: [ { stat: { id: stat.perception, min: 3 } } ]
          effects: [ { combat_insight: 10 } ]
          next: watched
        - text: { uk: "Тікати до світанку" }
          effects: [ { injury: { id: injury.body, amount: 3 } } ]
          next: fled
    won:
      text: { uk: "Шукачі тікають, покинувши здобич. У траві поблискують уламки старої зброї." }
      options:
        - text: { uk: "Зібрати уламки" }
    lost:
      text: { uk: "Удари, насичені ці, пробирають до самих меридіан. Ви отямлюєтеся вранці, знесилені й обібрані." }
    watched:
      text: { uk: "Вони проходять повз. До світанку ви подумки повторюєте, як вони тримають зброю." }
    fled:
      text: { uk: "Ви біжите навмання темним полем і не раз падаєте серед ям і кісток." }
