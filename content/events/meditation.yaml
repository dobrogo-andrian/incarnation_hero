# Events during meditation outside the settlement (§10, D38): rare and quiet.

- id: evt.meditation.flash_of_insight
  contexts: [meditation]
  weight: 6
  cooldown_weeks: 52
  nodes:
    start:
      text: { uk: "Посеред медитації потік ці раптом вибудовується в ясний візерунок. Ще трохи, і щось відкриється." }
      options:
        - text: { uk: "Піти за відчуттям" }
          outcomes:
            - weight: 5
              weight_per_stat: { stat.perception: 0.5 }
              success: true
              effects: [ { stat: { id: stat.perception, amount: 1 } }, { stat: { id: stat.purity, amount: 2 } } ]
              next: clarity
            - weight: 3
              effects: [ { injury: { id: injury.internal, amount: 5 } } ]
              next: backlash
        - text: { uk: "Не поспішати й утримати спокій" }
          effects: [ { resource: { id: resource.qi_pool, amount: 20 } } ]
          next: calm
    clarity:
      text: { uk: "Візерунок складається до кінця. Світ на мить стає прозорим, і ця прозорість лишається з вами." }
    backlash:
      text: { uk: "Візерунок розсипається, і ці б'є у зворотний бік. У грудях пече." }
    calm:
      text: { uk: "Ви відпускаєте видіння, і ці спокійно наповнює дань-тянь." }

- id: evt.meditation.hermit_visit
  contexts: [meditation]
  weight: 4
  once_per_run: true
  conditions:
    - zone: [zone.bamboo_grove, zone.river_valley, zone.misty_hills]
  nodes:
    start:
      text: { uk: "Неподалік сідає сивий самітник і довго мовчки дивиться, як ви медитуєте. «Подих у тебе рваний, як старий мішок», — каже він нарешті." }
      options:
        - text: { uk: "Попросити настанов (2 тижні)" }
          effects: [ { time: 2 }, { knowledge: { id: element.earth, amount: 25 } } ]
          next: teaching
        - text: { uk: "Пригостити самітника (5 каменів)" }
          conditions: [ { stones: { min: 5 } } ]
          effects: [ { stones: -5 }, { reveal: place.misty_hills.hermit_grotto } ]
          next: grotto
        - text: { uk: "Не зважати на нього" }
    teaching:
      text: { uk: "Два тижні самітник змушує вас слухати, як дихає земля. Наостанок лише пирхає: «Бувало й гірше»." }
    grotto:
      text: { uk: "Самітник смакує частування й, подобрівши, розповідає про грот у Туманних пагорбах, де колись медитував сам." }

- id: evt.meditation.qi_turbulence
  contexts: [meditation]
  weight: 6
  cooldown_weeks: 52
  nodes:
    start:
      text: { uk: "Ці раптом збивається з ритму й кидається меридіанами, як кінь, що понісся. Ще мить — і вона вийде з-під контролю." }
      options:
        - text: { uk: "Проштовхнути її силою" }
          outcomes:
            - weight: 3
              weight_per_stat: { stat.meridians: 0.3 }
              success: true
              effects: [ { stat: { id: stat.meridians, amount: 1 } } ]
              next: broke_through
            - weight: 4
              effects: [ { injury: { id: injury.internal, amount: 10 } } ]
              next: deviated
        - text: { uk: "Перервати медитацію й розсіяти її" }
          effects: [ { resource: { id: resource.qi_pool, amount: -30 } } ]
          next: dispersed
    broke_through:
      text: { uk: "Ці проривається крізь затор, і меридіан, що досі ледь пропускав її, розширюється." }
    deviated:
      text: { uk: "Потік рветься вбік. Ви відкашлюєте кров і довго не можете зібрати подих." }
    dispersed:
      text: { uk: "Ви відпускаєте ці, і вона розходиться без шкоди, лишаючи по собі порожнечу." }

- id: evt.meditation.spirit_fox
  contexts: [meditation]
  weight: 4
  once_per_run: true
  conditions:
    - zone: [zone.misty_hills, zone.spirit_peak]
  nodes:
    start:
      text: { uk: "Розплющивши очі, ви бачите на камені сріблясту лисицю. Вона дивиться не на вас, а на вашу торбу." }
      options:
        - text: { uk: "Пригостити її пігулкою збирання ці" }
          conditions: [ { item: { id: item.pill.qi_gathering, min: 1 } } ]
          effects: [ { item: { id: item.pill.qi_gathering, amount: -1 } }, { stat: { id: stat.perception, amount: 2 } } ]
          next: blessed
        - text: { uk: "Спробувати її впіймати" }
          outcomes:
            - weight: 1
              weight_per_stat: { aspect.speed.agility: 0.1 }
              success: true
              effects: [ { stones: 10 } ]
              next: caught
            - weight: 6
              effects: [ { injury: { id: injury.body, amount: 4 } } ]
              next: vanished
        - text: { uk: "Не зважати" }
    blessed:
      text: { uk: "Лисиця обережно бере пігулку й, перш ніж зникнути, торкається носом вашого чола. Світ стає трохи чіткішим." }
    caught:
      text: { uk: "Пальці хапають лише сріблясте хутро, що лишилося на камені. Аптекарі дадуть за нього добру ціну." }
    vanished:
      text: { uk: "Лисиця зникає, ніби її й не було, а ви боляче падаєте на каміння." }
