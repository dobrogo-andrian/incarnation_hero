# Enemies (D42): character snapshots computed by the same rules as the player (§2). Stats not
# listed are 0, so a beast without meridians has no qi shield. Draft numbers.
# A start-of-run player has 10 in every body stat: 100 health, a 50 qi shield, 10 damage.

- id: enemy.human.bandit
  name: { uk: "Розбійник" }
  ai: ai.cultivator_cautious
  stage: 0
  stats: { stat.might: 8, stat.endurance: 10, stat.speed: 11, stat.meridians: 1 }
  weapon_damage: 10.5

- id: enemy.beast.grey_wolf
  name: { uk: "Сірий вовк" }
  ai: ai.beast_aggressive
  stage: 0
  stats: { stat.might: 4, stat.endurance: 8, stat.speed: 13 }
  weapon_damage: 6

- id: enemy.beast.river_serpent
  name: { uk: "Річковий змій" }
  ai: ai.beast_aggressive
  stage: 1
  stats: { stat.might: 16, stat.endurance: 10, stat.speed: 8, stat.meridians: 4 }
  weapon_damage: 10

- id: enemy.human.relic_hunter
  name: { uk: "Шукач реліквій" }
  ai: ai.cultivator_cautious
  stage: 1
  stats: { stat.might: 10, stat.endurance: 12, stat.speed: 14, stat.meridians: 5 }
  weapon_damage: 9.1
  techniques: { tech.movement.crane_retreat: 1 }
  injury: injury.internal         # qi-laden palm strikes reach the meridians

- id: enemy.human.tomb_keeper
  name: { uk: "Сторож гробниці" }
  ai: ai.cultivator_cautious
  stage: 2
  stats: { stat.might: 19, stat.endurance: 17, stat.speed: 18, stat.meridians: 15 }
  weapon_damage: 12.6
  techniques: { tech.spear.piercing_dragon: 2 }   # a staff fights like a spear here
  injury: injury.internal

