# Pills (§4.3–4.4). Energy feeds assimilation; toxicity is the same every time, while energy
# shrinks by repeat_factor for every earlier pill of the same type. Draft numbers.

- id: item.pill.qi_gathering
  name: { uk: "Пігулка збирання ці" }
  pill: { energy: 30, toxicity: 8, repeat_factor: 0.8 }

- id: item.pill.spirit_dew
  name: { uk: "Пігулка духовної роси" }
  pill: { energy: 60, toxicity: 15, repeat_factor: 0.8 }

# A breakthrough pill (§4.5): no energy, raises the quality ceiling of the next breakthrough.
- id: item.pill.foundation_building
  name: { uk: "Пігулка закладання основи" }
  pill: { energy: 0, toxicity: 10, repeat_factor: 1, ceiling_bonus: 15 }

# Healing pills (§8): take injury points off at once; no energy.
- id: item.pill.bone_mending
  name: { uk: "Пігулка зрощення кісток" }
  pill: { energy: 0, toxicity: 6, repeat_factor: 1, heals: { injury.body: 25 } }

- id: item.pill.meridian_soothing
  name: { uk: "Пігулка заспокоєння меридіан" }
  pill: { energy: 0, toxicity: 8, repeat_factor: 1, heals: { injury.internal: 15 } }
