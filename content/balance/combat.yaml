# The stage 1 formula resolver (tech 4.1, D42): abstract rounds of shield → health → injuries.
# Draft numbers until Sim.Cli reports. The player starts with 100 health, a 50 qi shield that
# refills 5 a round from a 100 qi pool, and hits for 10.

id: config.combat
weapon_damage: 10                 # the base weapon, until weapons are items
technique_bonus_per_level: 0.15   # best technique level: damage × (1 + level × 0.15)
qi_density_per_stage: 0.3         # damage × (1 + qi stage × 0.3)
damage_spread: 0.2                # each hit is damage × 0.8–1.2

health_resource: resource.health
shield_resource: resource.combat_qi
qi_pool_resource: resource.qi_pool
flow_aspect: aspect.meridians.flow
refill_per_flow: 0.5              # shield refill a round = flow × 0.5
reaction_aspect: aspect.speed.reaction
agility_aspect: aspect.speed.agility
resilience_aspect: aspect.might.resilience

body_injury: injury.body
injury_per_resilience: 1          # injury points = damage to health / resilience
shield_break_injury: injury.internal
shield_break_chance: 0.5          # a hit that breaks the shield may hurt the meridians (§7.4)
shield_break_amount: 3

flee_health_share: 0.3            # below 30% health the player tries to escape (§7.6)
flee_chance_base: 0.5
flee_chance_per_point: 0.03       # per point of agility over the fastest enemy's reaction
flee_chance_min: 0.15
flee_chance_max: 0.9
fight_min_health_share: 0.5       # hunting and the arena need half of maximum health (§5)
max_rounds: 30                    # still undecided: the player withdraws

insight_per_difficulty: 25        # an even fight gives 25 points of combat insight
insight_max: 60
insight_fled_share: 0.4

# Hex combat (stage 2, D53–D56).
field_radius: 4                   # a hexagon of 61 hexes; its 24 rim hexes are the way out
initiative_threshold: 100         # CTB (D53): act when the gauge reaches 100
initiative_per_reaction: 1        # the gauge fills by reaction a tick: 10 reaction acts every 10 ticks
energy_output_aspect: aspect.endurance.output
energy_refill_per_output: 0.5     # end of own turn: output × 0.5 × health share comes back into the fight's pool (D55)
energy_refill_min: 2              # comes back whatever the body's state
energy_capacity_per_output: 1.5   # the fight's pool holds output × 1.5 and starts full; the body never runs dry
move_points_per_agility: 0.3       # 10 agility walks 3 hexes a turn, all before the action (D56)
step_energy: 1                    # every step costs body energy; the movement points still cap a turn's steps
guard_energy: 3                   # guard: until the next own turn hits through the shield land at half
guard_body_share: 0.5
flee_energy: 4                    # escape from a rim hex with no enemy next to it (§7.6)
max_turns: 200                    # an undecided hex fight: side 0 is taken to have withdrawn (D59)
player_ai: ai.cultivator_cautious # who plays the player in arena runs and auto-resolve
attack_energy: 4                  # the basic attack: a fresh body (5 a turn) keeps it up, an empty reserve (2) every other turn
