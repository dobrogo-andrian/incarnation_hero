# Run-wide balance parameters.

id: config.run
start_age_years: 12             # §3
weeks_per_year: 52              # D16
start_lifespan_years: 60        # §3
natural_death_window_years: 3   # D21: death possible from 3 years before the expected lifespan
life_end_warning_years: [5, 1]  # D24

stats: [stat.might, stat.endurance, stat.speed, stat.meridians, stat.perception, stat.purity]
resources: [resource.health, resource.body_energy, resource.qi_pool, resource.combat_qi, resource.toxins]
toxins_resource: resource.toxins   # pills add toxicity here, up to its maximum (§4.4)
start_aspect_profile: aspect_profile.balanced   # without an active method (A2)
start_zone: zone.hub
meditation_depleted_floor: 0.2   # D30: meditation on an exhausted place still gives 20%
recovery_meditation: meditation.recovery   # D72: what "meditate" on the main screen starts
combat_insight_decay: 0.1        # D31: combat insight loses 10% of its points a week
combat_insight_min_points: 1     # below this it is gone

# Knowledge and foundation (§4.1, §6, D34). Draft numbers.
knowledge_level_points: [20, 40, 80, 160, 320]   # comprehension points per level; 5 levels at most
element_basic_max_level: 1       # elements sensed without a folio stop here
foundation_per_knowledge_level: 10
foundation_per_purity: 1
purity_stat: stat.purity
