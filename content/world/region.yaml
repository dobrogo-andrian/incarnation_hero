# Hand-made region for stage 1 (§9, D29): a hub and 5 zones. Names and numbers are a draft.
# Danger grows away from the hub; place quality stays at or below its zone's danger (tech 4.2).
# Meditation draws `density` from a place's reserve each week (D30), so regen stays below density:
# weak places run dry within weeks, the spirit vein lasts about a year.
#
# Routes (weeks): hub–bamboo_grove 1, hub–river_valley 2, bamboo_grove–misty_hills 2,
# river_valley–misty_hills 2, river_valley–old_battlefield 3, misty_hills–spirit_peak 3,
# old_battlefield–spirit_peak 2; hidden: old_battlefield–ancient_tomb 2.
#
# Map points (D44) are percent of the map screen: `map` on a zone is its region map point; the hub
# also has a local map, where its places and shops carry their own `map` point.
#
# Hidden zones and places (D40) are unknown until an event reveals them: the tomb, the spring
# in the grove and the hermit's grotto in the hills.

- id: zone.hub
  name: { uk: "Поселення Біля Підніжжя" }
  danger: 0
  settlement: true
  map: { x: 50, y: 88 }
  local_map: { inquire: { x: 30, y: 62 }, exit: { x: 50, y: 92 } }

- id: zone.bamboo_grove
  name: { uk: "Бамбуковий гай" }
  danger: 1
  map: { x: 24, y: 66 }

- id: zone.river_valley
  name: { uk: "Річкова долина" }
  danger: 1
  map: { x: 74, y: 70 }

- id: zone.misty_hills
  name: { uk: "Туманні пагорби" }
  danger: 2
  map: { x: 36, y: 40 }

- id: zone.old_battlefield
  name: { uk: "Старе поле битви" }
  danger: 2
  map: { x: 80, y: 40 }

- id: zone.spirit_peak
  name: { uk: "Пік духовної жили" }
  danger: 3
  map: { x: 56, y: 12 }

- id: zone.ancient_tomb
  name: { uk: "Гробниця Забутого Майстра" }
  danger: 3
  hidden: true
  map: { x: 90, y: 14 }

- id: route.hub.bamboo_grove
  a: zone.hub
  b: zone.bamboo_grove
  weeks: 1

- id: route.hub.river_valley
  a: zone.hub
  b: zone.river_valley
  weeks: 2

- id: route.bamboo_grove.misty_hills
  a: zone.bamboo_grove
  b: zone.misty_hills
  weeks: 2

- id: route.river_valley.misty_hills
  a: zone.river_valley
  b: zone.misty_hills
  weeks: 2

- id: route.river_valley.old_battlefield
  a: zone.river_valley
  b: zone.old_battlefield
  weeks: 3

- id: route.misty_hills.spirit_peak
  a: zone.misty_hills
  b: zone.spirit_peak
  weeks: 3

- id: route.old_battlefield.spirit_peak
  a: zone.old_battlefield
  b: zone.spirit_peak
  weeks: 2

- id: route.old_battlefield.ancient_tomb
  a: zone.old_battlefield
  b: zone.ancient_tomb
  weeks: 2

# Meditation places: wild spots are weak, caves medium, the spirit vein strong (§9).

- id: place.hub.quiet_courtyard
  name: { uk: "Тихий двір" }
  description: { uk: "Вимощений камінням двір за стіною поселення. Стара сосна, кам'яна лава й тиша, яку порушують хіба що горобці. Ці тут ледь відчутна, зате ніхто не заважає." }
  zone: zone.hub
  map: { x: 50, y: 22 }
  density: 1
  capacity: 8
  regen_per_week: 0.25

- id: place.bamboo_grove.clearing
  name: { uk: "Галявина серед бамбуку" }
  description: { uk: "Невелика галявина, оточена шелестким бамбуком. Вітер гойдає стовбури, і в їхньому стукоті легко втратити лік часу." }
  zone: zone.bamboo_grove
  density: 1
  capacity: 10
  regen_per_week: 0.25

- id: place.river_valley.boulder
  name: { uk: "Валун над водою" }
  description: { uk: "Плаский валун над бистриною. Вода внизу не змовкає ні на мить, а в бризках ледь помітно мерехтить ці." }
  zone: zone.river_valley
  density: 1.5
  capacity: 15
  regen_per_week: 0.5

- id: place.misty_hills.cave
  name: { uk: "Печера туману" }
  description: { uk: "Низька печера, куди туман затікає, мов вода. Стіни вкриті вологим мохом, а повітря густе від ці." }
  zone: zone.misty_hills
  density: 2
  capacity: 60
  regen_per_week: 0.5

- id: place.old_battlefield.altar
  name: { uk: "Розбитий вівтар" }
  description: { uk: "Розколотий кам'яний вівтар серед іржавих уламків зброї. Ці тут сильна, але неспокійна, наче пам'ятає давню різанину." }
  zone: zone.old_battlefield
  density: 2.5
  capacity: 70
  regen_per_week: 0.75

- id: place.spirit_peak.vein
  name: { uk: "Духовна жила" }
  description: { uk: "Тріщина в скелі на самій вершині, звідки струменить світла ці. Від її подиху дзвенить у вухах, і медитувати тут — майже як пити з джерела." }
  zone: zone.spirit_peak
  density: 4
  capacity: 200
  regen_per_week: 1

- id: place.ancient_tomb.sealed_hall
  name: { uk: "Запечатана зала" }
  description: { uk: "Зала за кам'яними дверима, вкрита печатками, що ледь жевріють. Повітря нерухоме, і кожен крок відлунює надто довго." }
  zone: zone.ancient_tomb
  density: 3.5
  capacity: 150
  regen_per_week: 1

# Hidden places: a little better than what their zone offers in the open.
- id: place.bamboo_grove.hidden_spring
  name: { uk: "Прихована джерельна заводь" }
  description: { uk: "Тиха заводь серед густого бамбуку, про яку знають одиниці. Вода прозора до самого дна, а над нею повисла прохолодна ці." }
  zone: zone.bamboo_grove
  density: 2
  capacity: 25
  regen_per_week: 0.5
  hidden: true

- id: place.misty_hills.hermit_grotto
  name: { uk: "Грот самітника" }
  description: { uk: "Затишний грот із вигладженою підлогою та давно погаслим вогнищем. Хтось роками медитував тут, і його спокій досі висить у повітрі." }
  zone: zone.misty_hills
  density: 3
  capacity: 80
  regen_per_week: 0.75
  hidden: true
