# Training activities (§5): hired work, hunting grounds and the arena. Draft numbers until Sim.Cli
# reports. Gains are points a week on the stats' scales (D48). Overflow fades 5% a week, so a steady
# gain g levels off at 20 × g of overflow and never quite reaches it: g must keep 20 × g clear of a
# rank's breakthrough (2, 3, 4, 5, 6), or the bar looks full and never breaks through. 0.12 levels off
# at 2.4 (through rank I, stops in rank II), 0.17 at 3.4 (through II), 0.225 at 4.5 (through III, halfway to IV).

# Hired work (§13.2): small guaranteed pay, no rare finds. Taken at the hub's job board.
- id: job.hub.porter
  name: { uk: "Вантажник" }
  zone: zone.hub
  pay: 1
  gains: { stat.might: 0.17, stat.endurance: 0.05 }

- id: job.hub.courier
  name: { uk: "Гонець" }
  zone: zone.hub
  pay: 1
  gains: { stat.speed: 0.17, stat.endurance: 0.05 }

- id: job.hub.apothecary_helper
  name: { uk: "Помічник аптекаря" }
  zone: zone.hub
  pay: 1
  gains: { stat.perception: 0.1 }

# Hunting grounds: weekly chance of prey; a lost fight can kill outside the settlement's woods.
- id: hunt.hub.woods
  name: { uk: "Угіддя за частоколом" }
  description: { uk: "Рідкий ліс і чагарники за частоколом поселення. Тут ставлять сильця на зайців, а смільчаки виходять із рогатиною на кабана." }
  zone: zone.hub
  map: { x: 34, y: 14, district: district.hub.outskirts }
  encounter_chance: 0.35
  groups: { grp.beast.wild_boar: 2, grp.beast.red_foxes: 3 }
  gains: { stat.speed: 0.12, stat.perception: 0.05 }

- id: hunt.bamboo_grove.thicket
  name: { uk: "Бамбукові хащі" }
  description: { uk: "Хащі, де бамбук росте так густо, що звір чує тебе раніше, ніж ти його бачиш. Сліди вовків тут свіжі." }
  zone: zone.bamboo_grove
  encounter_chance: 0.3
  groups: { grp.beast.lone_wolf: 3, grp.beast.wild_boar: 2, grp.beast.grey_wolves: 1 }
  gains: { stat.speed: 0.17, stat.perception: 0.05 }

- id: hunt.river_valley.reeds
  name: { uk: "Очерети над річкою" }
  description: { uk: "Високі очерети вздовж ріки. Кабани приходять сюди на водопій, а у глибокій воді ворушиться щось набагато більше." }
  zone: zone.river_valley
  encounter_chance: 0.3
  groups: { grp.beast.wild_boar: 3, grp.beast.grey_wolves: 1, grp.beast.river_serpent: 1 }
  gains: { stat.might: 0.12, stat.speed: 0.12 }

- id: hunt.misty_hills.ridges
  name: { uk: "Туманні гребені" }
  description: { uk: "Кам'янисті гребені, де туман ховає і здобич, і мисливця. Плямисту шкуру леопарда тут цінують на вагу каменів." }
  zone: zone.misty_hills
  encounter_chance: 0.25
  groups: { grp.beast.mist_leopard: 2, grp.beast.grey_wolves: 1 }
  gains: { stat.speed: 0.225, stat.perception: 0.05 }

# The arena: a fee before every weekly bout, a prize for a win; bouts end in yielding, not death.
- id: arena.hub
  name: { uk: "Арена Кривавого Піску" }
  description: { uk: "Кругла яма, засипана піском, і дерев'яні лави навколо. Тут б'ються за гроші й славу, а розпорядник зупиняє бій, щойно хтось здається." }
  zone: zone.hub
  map: { x: 16, y: 66, district: district.hub.arena }
  gains: { stat.might: 0.17, stat.speed: 0.12 }
  bouts:
    - { group: grp.arena.novices, fee: 2, prize: 6 }
    - { group: grp.arena.brawlers, fee: 5, prize: 15 }
    - { group: grp.arena.adepts, fee: 10, prize: 30 }
    - { group: grp.arena.champion, fee: 20, prize: 60 }

# Districts of the hub's local map: points grouped by what they are for.
- id: district.hub.outskirts
  name: { uk: "Околиця" }
  zone: zone.hub

- id: district.hub.market
  name: { uk: "Ринок" }
  zone: zone.hub

- id: district.hub.arena
  name: { uk: "Арена й біржа праці" }
  zone: zone.hub
